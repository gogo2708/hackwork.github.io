services:
  - type: web
    name: hackwork
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CONTACT_EMAIL
        value: info@hackwork.space
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
